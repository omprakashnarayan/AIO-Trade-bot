# Credential-free MCP configuration example. Do not add secrets.
# Provider reads use MCP only. OAuth/API credentials are not used for sync.
mcp_servers:
  portfolio_tracker:
    url: "http://127.0.0.1:5055/mcp"
    timeout: 30
    connect_timeout: 5
    headers: {}
    policy:
      status: configured_endpoint_requires_runtime_auth
      capabilities: [health, portfolio_read, paper_proposals, paper_orders, promotion_gates, provider_mcp_status, provider_mcp_snapshot]
      live_orders: disabled

  kite:
    url: "https://mcp.kite.trade/mcp"
    policy:
      mode: mcp_only
      status: browser_authorization_required_until_real_read_succeeds
      capabilities: [read_only_after_discovery_schema_validation_and_reconciliation]
      writes: disabled
      oauth_api_sync: disabled
      source: "official Zerodha hosted MCP endpoint"

  upstox:
    url: "# unconfigured: no official endpoint verified"
    policy:
      mode: mcp_only
      status: unconfigured_honest_no_verified_official_endpoint
      capabilities: [read_only_after_discovery_schema_validation_and_reconciliation]
      writes: disabled
      oauth_api_sync: disabled

  indmoney:
    url: "https://mcp.indmoney.com/mcp"
    policy:
      mode: mcp_only
      status: read_only_browser_handoff; no connected data claimed without verified read
      capabilities: [read_only_after_discovery_schema_validation_and_reconciliation]
      writes: disabled
      oauth_api_sync: disabled
