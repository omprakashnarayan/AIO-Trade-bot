# Credential-free Hermes Agent example. Do not add secrets to this file.
# The local app endpoint is callable only with an operator session or
# PORTFOLIO_MCP_API_TOKEN configured at runtime.
mcp_servers:
  portfolio_tracker:
    url: "http://127.0.0.1:5055/mcp"
    timeout: 30
    connect_timeout: 5
    headers: {}
    sampling:
      enabled: false
    policy:
      status: configured_endpoint_requires_runtime_auth
      capabilities: [health, portfolio_read, paper_proposals, paper_orders, promotion_gates]
      live_orders: disabled

  kite:
    url: "# configure only after discovering and verifying an authorized provider MCP transport"
    policy:
      status: unconfigured
      capabilities: [read_only_after_discovery_and_reconciliation]
      writes: disabled

  upstox:
    url: "# configure only after discovering and verifying an authorized provider MCP transport"
    policy:
      status: unconfigured
      capabilities: [read_only_after_discovery_and_reconciliation]
      writes: disabled

  indmoney:
    url: "# manual/MCP handoff only; no local execution adapter"
    policy:
      status: read_only
      capabilities: [manual_import, read_only_handoff]
      writes: disabled
